name: Retrain Breast Cancer Model

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MLProject
    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.3.3 numpy==1.26.4 scikit-learn==1.5.2

      - name: Run mlflow project
        run: mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          python - <<'PY'
          import mlflow

          mlflow.set_tracking_uri("file:./mlruns")
          runs = mlflow.search_runs(order_by=["start_time DESC"], max_results=1)
          if runs.empty:
              raise SystemExit("No MLflow runs found")

          run_id = runs.iloc[0]["run_id"]
          print(f"Latest MLflow run_id: {run_id}")
          PY
